<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket RAG</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
<div class="app-container">
    <section class="glass-card upload-hub">
        <h2>Pocket RAG</h2>
        <input type="file" id="file-input" multiple hidden>
        <div id="drop-zone" class="glow-border">
            <span id="drop-zone-text">+ Drop your PDFs, TXT, or Markdown here</span>
        </div>
        <div class="active-queue"></div>
        <button id="start-indexing">Start Indexing</button>
    </section>

    <section class="glass-card search-interface">
        <div class="chat-header">
            <h3>Search Interface</h3>
            <button id="clear-chat">Clear Chat</button>
        </div>
        <div style="display: flex; gap: 15px; flex: 1; min-height: 0;">
            <!-- Sidebar with ingested files -->
            <div style="width: 200px; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 15px; overflow-y: auto;">
                <h4 style="margin-bottom: 15px; color: rgba(255,255,255,0.7);">Ingested Files</h4>
                <div id="ingestions-list"></div>
            </div>
            <!-- Chat window -->
            <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                <div id="chat-window"></div>
                <div class="input-area">
                    <input type="text" id="query-input" placeholder="Ask a question...">
                    <button id="send-btn">➔</button>
                </div>
            </div>
        </div>
    </section>
</div>
<script src="{{ url_for('static', path='/script.js') }}"></script>
</body>
</html>
